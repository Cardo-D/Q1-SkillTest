<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics club form</title>
    <style>
          body {
            background-image: url("https://wallpaperaccess.com/full/782538.jpg");
            background-color: rgb(250, 250, 248);
            background-repeat: no-repeat;
            background-size: cover;
            font-family: monospace;
            /* min-height: 100vh;  */
            background-attachment: fixed;
            
        }

        .main {
            padding: 20px;
            background-color: rgb(255, 255, 255);
            border-radius: 10px;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.1);
            width: 60%;
            margin-bottom: 50px;
        }
        footer {
            text-align: center;
            color:white;
            position: fixed;
            margin-bottom: 0;
            margin: 0;
            left: 0;
            bottom: 0;
            width: 100%;
        }
      
       
    </style>
</head>
<body>
    <div class="main">
        <img class= obmc src="https://files.orangeapps.ph/disk001/School_Files/1/school-66/school_profile/1724046763-1128.png" style="width: 100px" >
        <h1 style="text-align: center;"> <a href="https://obmontessorigreenhills.orangeapps.ph/oa_school/classfeed" target="_blank"> Join the OBMC Robotics CLub</a> </h1>
        <p style="text-align: center;">Fill out the form below to join the Robotics Club.</p>
        <form> 
            <fieldset> 
                <legend>Fill out your details</legend>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter full name here">
                <br><br>
                <label for="gradeandsection">Grade and section:</label>
                <input type="text" id="gradeandsection" name="gradeandsection" placeholder="Enter grade and section here">
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter email here">
                <br><br>
                <label for="gender" >Gender:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <br><br>
                <label for="skills">What are your skills?:</label>
                <br>
                <input type="checkbox" id="programming" name="skills" value="programming">
                <label for="programming">Programming</label>
                <input type="checkbox" id="electronics" name="skills" value="electronics">
                <label for="electronics">Electronics</label>
                <input type="checkbox" id="mechanical" name="skills" value="mechanical">
                <label for="mechanical">Mechanical</label>
                <br><br>
                <label for="why do you want to join" >Why do you want to join?:</label>
               <br>
                <textarea id="why" name="why" placeholder="Enter your reason here"></textarea>
                <br><br>
                <input type="submit" value="Submit Form">
                
                
            </fieldset>
        </form>
        </div>
    <footer>
        <p>&copy; 2026 Azul Dalisay. All rights reserved.</p>
    </footer>
</body>
</html>
